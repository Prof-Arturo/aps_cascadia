<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
<rect width="1200" height="1200" fill="#FFFFFF"/>
<line x1="60" y1="80" x2="1140" y2="80" stroke="#29431F" stroke-width="5"/>
<text x="600" y="175" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="bold" fill="#29431F">IS THERE A PLACE</text>
<text x="600" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="bold" fill="#29431F">WHERE THINGS KEEP HAPPENING?</text>
<text x="600" y="320" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#222222">The American Periphenomenal Survey (APS) is documenting</text>
<text x="600" y="354" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#222222">locations across the Cascadia Bioregion where anomalous</text>
<text x="600" y="388" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#222222">experiences occur to more than one person, across time.</text>
<text x="600" y="446" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#222222">We are collecting stories of places where:</text>
<circle cx="120" cy="482" r="5" fill="#29431F"/>
<text x="155" y="490" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#222222"><tspan font-weight="bold">The same thing happens to different people</tspan><tspan font-weight="normal"> — across witnesses and years</tspan></text>
<circle cx="120" cy="526" r="5" fill="#29431F"/>
<text x="155" y="534" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#222222"><tspan font-weight="bold">The stories keep coming back</tspan><tspan font-weight="normal"> — reputation across generations or a neighborhood</tspan></text>
<circle cx="120" cy="570" r="5" fill="#29431F"/>
<text x="155" y="578" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#222222"><tspan font-weight="bold">You know to be careful there</tspan><tspan font-weight="normal"> — a spot locals warn newcomers about</tspan></text>
<circle cx="120" cy="614" r="5" fill="#29431F"/>
<text x="155" y="622" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#222222"><tspan font-weight="bold">The record goes back</tspan><tspan font-weight="normal"> — surfaces in newspaper archives, oral tradition, old maps</tspan></text>
<text x="600" y="714" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" font-style="italic" fill="#222222">Some places tell the same story to everyone who listens.</text>
<text x="600" y="754" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" font-style="italic" fill="#29431F">We do not judge. We document.</text>
<text x="600" y="814" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#29431F">CONTRIBUTE TO THE REGISTRY</text>
<text x="600" y="858" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" fill="#29431F">aps-project.org</text>
<line x1="60" y1="1110" x2="1140" y2="1110" stroke="#29431F" stroke-width="5"/>
<text x="600" y="1150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#666666">American Periphenomenal Survey  |  Region 10 (🌲 Cascadia)</text>
<text x="600" y="1175" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#666666">Methodological Agnosticism Observed</text>
</svg>